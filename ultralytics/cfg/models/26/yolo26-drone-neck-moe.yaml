# Modified YOLOv8 model with added P2 detection head and removed P5 detection head
# Based on YOLO-Drone paper: https://doi.org/10.3390/electronics12173664

# Parameters
nc: 80 # number of classes (UAV only for drone detection)
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# YOLOv8.0n backbone with modified structure (removed P5-related layers)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4 (output resolution: 160x160 for 640x640 input)
  - [-1, 1, ES_MOE, [128]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, ES_MOE, [256]]
  - [-1, 1, Conv,  [512, 3, 2]] # 5-P4/16
  - [-1, 1, ES_MOE, [512]]
  # Removed P5/32 layers: Conv to 1024 and C2f layers
  - [-1, 1, SPPF, [512, 5, 3, True]] # 7
  - [-1, 2, C2PSA, [512]] # 8

# Modified YOLOv8 head with added P2 detection head and removed P5 detection head
head:

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 1, NeckES_MOE, [256]] # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 1, NeckES_MOE, [128]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P3
  - [-1, 1, NeckES_MOE, [256]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P4
  - [-1, 1, NeckES_MOE, [512]]  # 25 (P4/16-medium)

  - [[14, 17, 20], 1, Detect, [nc]]
