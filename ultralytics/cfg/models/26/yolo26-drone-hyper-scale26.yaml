# Ultralytics YOLO26 with HyperACE injection
# Based on YOLO-Drone modified YOLOv8-P2 structure

nc: 80
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

scales:
  n: [0.50, 0.25, 1024] # summary: 260 layers, 2,572,280 parameters, 2,572,280 gradients, 6.1 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 260 layers, 10,009,784 parameters, 10,009,784 gradients, 22.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 280 layers, 21,896,248 parameters, 21,896,248 gradients, 75.4 GFLOPs
  l: [1.00, 1.00, 512] # summary: 392 layers, 26,299,704 parameters, 26,299,704 gradients, 93.8 GFLOPs
  x: [1.00, 1.50, 512] # summary: 392 layers, 58,993,368 parameters, 58,993,368 gradients, 209.5 GFLOPs


# =========================
# Backbone
# =========================

backbone:

  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]       # 0 P1/2

  - [-1, 1, Conv, [128, 3, 2]]      # 1 P2/4
  - [-1, 1, ES_MOE, [128]]          # 2 B2


  - [-1, 1, Conv, [256, 3, 2]]      # 3 P3/8
  - [-1, 1, ES_MOE, [256]]          # 4 B3


  - [-1, 1, Conv, [512, 3, 2]]      # 5 P4/16
  - [-1, 1, ES_MOE, [512]]          # 6

  - [-1, 1, SPPF, [512, 5, 3, True]] # 7

  - [-1, 2, C2PSA, [512]]           # 8 B4

# =========================
# Head + HyperACE
# =========================

head:

  # =========================
  # HyperACE
  # B2 B3 B4 -> H3
  # =========================

  - [[2,4,8],1,HyperACE,[256,8,True,True,0.5,1,"both"]]   # 9


  # =========================
  # Generate H2 / H4
  # =========================

  # H3 -> H2
  - [9,1,nn.Upsample,[None,2,"nearest"]]                  # 10


  # H3 -> H4
  - [9,1,DownsampleConv,[]]                               # 11



  # =========================
  # Backbone Injection
  # =========================


  # -------- B4 + H4 --------

  - [11,1,Conv,[512,1,1]]                                 # 12
  # 512*0.25=128

  - [[8,-1],1,FullPAD_Tunnel,[]]                           # 13



  # -------- B3 + H3 --------

  - [9,1,Conv,[256,1,1]]                                  # 14
  # 256*0.25=64

  - [[4,-1],1,FullPAD_Tunnel,[]]                           # 15



  # -------- B2 + H2 --------

  - [10,1,Conv,[128,1,1]]                                 # 16
  # 128*0.25=32

  - [[2,-1],1,FullPAD_Tunnel,[]]                           # 17




  # =========================
  # P3 Neck
  # =========================


  - [13,1,nn.Upsample,[None,2,"nearest"]]                  # 18


  - [[-1,15],1,Concat,[1]]                                 # 19


  - [-1,2,C3k2,[256,False]]                                # 20


  # P3 + H3

  - [9,1,Conv,[256,1,1]]                                  # 21
  # H3 256->64

  - [[20,-1],1,FullPAD_Tunnel,[]]                          # 22





  # =========================
  # P2 Neck
  # =========================


  - [20,1,nn.Upsample,[None,2,"nearest"]]                  # 23


  - [[-1,17],1,Concat,[1]]                                 # 24


  - [-1,2,C3k2,[128,False]]                                # 25


  # P2 + H2

  - [10,1,Conv,[128,1,1]]                                 # 26
  # H2 256->32


  - [[25,-1],1,FullPAD_Tunnel,[]]                          # 27





  # =========================
  # Bottom-up P3
  # =========================


  - [-1,1,Conv,[128,3,2]]                                  # 28


  - [[-1,22],1,Concat,[1]]                                 # 29


  - [-1,2,C3k2,[256,False]]                                # 30


  # P3 + H3

  - [9,1,Conv,[256,1,1]]                                  # 31


  - [[30,-1],1,FullPAD_Tunnel,[]]                          # 32





  # =========================
  # P4 Neck
  # =========================


  - [-1,1,Conv,[256,3,2]]                                  # 33


  - [[-1,13],1,Concat,[1]]                                 # 34


  - [-1,2,C3k2,[512,False]]                                # 35


  # P4 + H4

  - [12,1,Conv,[512,1,1]]                                 # 36
  # H4 512->128


  - [[35,-1],1,FullPAD_Tunnel,[]]                          # 37




  # =========================
  # Detect
  # =========================

  - [[27,32,-1],1,Detect,[nc]]